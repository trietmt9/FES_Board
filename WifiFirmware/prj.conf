# nRF7002DK Wi-Fi scan — minimal but complete.
#
# Derived from zephyr/samples/net/wifi/shell/prj.conf, trimmed to what a scan
# actually needs. Nothing here is decoration; each block is required.

# ---- Wi-Fi ----
# CONFIG_WIFI_NRF70 is selected automatically from the devicetree (the board
# enables nordic,nrf7002-spi), so it is deliberately NOT set by hand here.
CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_INF=y

# ---- Networking ----
# IPv4 is REQUIRED even though a scan uses no IP at all. The nRF70 driver calls
# net_if_mcast_mon_register() under CONFIG_NRF70_STA_MODE, and that function
# only exists when CONFIG_NET_NATIVE_IPV4 or _IPV6 is set - without one the
# build fails at link, not at configure. It is needed for DHCP later anyway.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

# ---- Management events ----
# Scan results arrive one net_mgmt event per access point. The queue must be
# deep enough to hold a crowded environment or results are dropped silently -
# that is why the upstream sample raises both of these.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# ---- Stacks ----
# The nRF70 driver runs its own work queues and sizes its own heap through
# CONFIG_HEAP_MEM_POOL_ADD_SIZE_NRF70, so do not hand-tune the heap. Main needs
# room because the scan callback formats strings on it.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# ---- Console / logging ----
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# Deferred logging, with a buffer that can actually hold a scan.
#
# The defaults are 1024 bytes drained once a second, which a scan burst
# overflows outright - the console then shows "--- N messages dropped ---"
# instead of the access points. main.c also keeps all printing off the
# net_mgmt event thread, which is the real fix; these two are the belt to that
# braces.
#
# Deferred is kept deliberately. IMMEDIATE mode would write synchronously from
# whichever thread called LOG_INF, which is worse here: it would block the
# net_mgmt event thread on the UART and drop scan results instead of log lines.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10

# ---- Randomness ----
# The Wi-Fi stack needs sys_rand_get(). On the nRF5340 application core
# DTS sets zephyr,entropy = &rng_hci, so real entropy arrives over the HCI link
# from the NETWORK core - which would mean enabling Bluetooth and flashing a
# controller just to scan. The upstream Wi-Fi sample avoids that the same way.
#
# !!! NOT CRYPTOGRAPHICALLY SECURE. Fine for scanning, which uses no keys.
# !!! Replace it before connecting to a secured network (WPA2/WPA3) or using
# !!! TLS: either CONFIG_BT=y so rng_hci works, or a CSPRNG seeded from it.
CONFIG_TEST_RANDOM_GENERATOR=y
